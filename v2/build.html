<!DOCTYPE html>
<html lang="en" class="h-full select-none overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMING SOON</title>
    <!-- Tailwind CSS for layout alignment -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vintage terminal/monospace font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'VT323', monospace;
        }

        .crt-raster-grill {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.95) 50%
            );
            background-size: 100% 3px;
            z-index: 15;
            pointer-events: none;
        }

        /* Ambient high-frequency phosphor screen hum - extremely subtle white/gray */
        .crt-phosphor-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            box-shadow: inset 0 0 80px rgba(255, 255, 255, 0.02);
            animation: phosphor-noise 0.15s infinite;
        }

        @keyframes phosphor-noise {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        .white-glitch-text {
            color: #ffffff;
            font-size: 6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
            padding-left: 0.2em; /* Centers the letter-spacing */
            line-height: 1;
            /* Multi-layered crisp white/silver bloom vectors */
            text-shadow: 
                0 0 4px rgba(255, 255, 255, 0.95),
                0 0 12px rgba(255, 255, 255, 0.4),
                0 0 30px rgba(255, 255, 255, 0.15);
            position: relative;
            will-change: transform, filter, text-shadow;
            transition: transform 0.05s ease-out;
            /* Continuous subtle organic micro-vibration */
            animation: micro-hum 0.1s infinite alternate;
        }

        @keyframes micro-hum {
            0% { transform: translate(0.2px, 0.2px) skewX(0.1deg); }
            100% { transform: translate(-0.2px, -0.2px) skewX(-0.1deg); }
        }

        /* Responsive scales */
        @media (max-width: 1024px) {
            .white-glitch-text {
                font-size: 4.5rem;
                letter-spacing: 0.15em;
                padding-left: 0.15em;
            }
        }
        @media (max-width: 640px) {
            .white-glitch-text {
                font-size: 2.75rem;
                letter-spacing: 0.1em;
                padding-left: 0.1em;
            }
        }
    </style>
</head>
<body>

    <!-- Vintage Static Screen Raster Filters -->
    <div class="crt-raster-grill"></div>
    <div class="crt-phosphor-screen"></div>

    <!-- The Singular Display Output -->
    <h1 class="white-glitch-text">
        Digita v2.X build tool, coming soon.
    </h1>

    <script>
        const textElement = document.querySelector('.white-glitch-text');

        // Helper to generate a random number within a range
        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Handles a single burst glitch sequence
        function triggerGlitch() {
            // 20% chance of a severe high-voltage deflection/sync-drop
            const isSevere = Math.random() > 0.8;
            const duration = isSevere ? randomRange(180, 380) : randomRange(60, 160);
            const stepInterval = 30; // updates every 30ms
            const steps = Math.floor(duration / stepInterval);
            
            let currentStep = 0;

            const glitchInterval = setInterval(() => {
                if (currentStep >= steps) {
                    clearInterval(glitchInterval);
                    
                    // Reset to stable, clean state
                    textElement.style.transform = '';
                    textElement.style.filter = '';
                    textElement.style.textShadow = '';

                    // Schedule next random glitch occurrence (between 1.5 to 6.5 seconds)
                    const nextDelay = randomRange(1500, 6500);
                    setTimeout(triggerGlitch, nextDelay);
                    return;
                }

                // Calculate random physical deflection matrices
                const skewX = randomRange(-14, 14);
                // Randomly squash or stretch text scale
                const scaleY = isSevere 
                    ? (Math.random() > 0.5 ? randomRange(0.1, 0.35) : randomRange(1.3, 1.7)) 
                    : randomRange(0.92, 1.08);
                
                const blurVal = randomRange(0, isSevere ? 3.5 : 1.2);
                const brightnessVal = randomRange(0.6, isSevere ? 2.4 : 1.35);
                
                // Displacement offsets for RGB/Shadow convergence splitting
                const shadowX1 = randomRange(-12, 12);
                const shadowX2 = randomRange(-6, 6);

                // Apply transient visual damage
                textElement.style.transform = `skewX(${skewX}deg) scaleY(${scaleY})`;
                textElement.style.filter = `blur(${blurVal}px) brightness(${brightnessVal})`;
                textElement.style.textShadow = `
                    ${shadowX1}px 0 4px rgba(255, 255, 255, 0.95),
                    ${shadowX2}px 0 12px rgba(255, 255, 255, 0.45),
                    0 0 30px rgba(255, 255, 255, 0.15)
                `;

                currentStep++;
            }, stepInterval);
        }

        // Initialize the first glitch event shortly after bootup
        window.addEventListener('load', () => {
            setTimeout(triggerGlitch, 1000);
        });
    </script>

</body>
</html>
