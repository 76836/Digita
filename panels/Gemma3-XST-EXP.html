<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wllama Chat</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background: #121212;
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #4285F4, #EA4335, #FBBC05, #34A853);
            background-size: 200% 100%;
            animation: gradientMove 4s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .header {
            background: #1a1a1a;
            padding: 1rem;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: auto;
            padding: 0.5rem 1rem;
            background: #242424;
            border-radius: 20px;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: rgb(45, 212, 191);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            padding: 1rem;
            background: #1a1a1a;
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            max-width: 85%;
        }

        .user-message {
            background: #242424;
            margin-left: auto;
        }

        .assistant-message {
            background: rgba(66, 133, 244, 0.2);
            margin-right: auto;
        }
      
        .system-message {
            background: #2a2a2a;
            color: rgb(255,255,255, 0.67);
            margin: 0.5rem auto;
            font-style: italic;
            text-align: center;
        }

        .input-area {
            padding: 1rem;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 0.75rem;
        }

        #user-input {
            background: #242424;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 0.75rem;
            border-radius: 8px;
            outline: none;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        #send-button {
            background: rgb(20, 166, 20);
            color: #000;
        }

        #send-button:disabled {
            background: #2a2a2a;
            color: #666;
            cursor: not-allowed;
        }

        #clear-button {
            background: #242424;
            color: #fff;
        }

        #setup-container {
            padding: 1rem;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        #system-prompt {
            width: 100%;
            background: #242424;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 0.75rem;
            border-radius: 8px;
            margin: 0.5rem 0;
            min-height: 100px;
            resize: vertical;
        }

        #save-prompt {
            background: #040424;
            color: #fff;
            padding: 0.5rem 1rem;
            border: 0px solid #2a2a2a;
            border-radius: 8px;
            cursor: pointer;
            width:100%;
        }

        #loading {
            text-align: center;
            padding: 1rem;
            color: rgb(45, 212, 191);
            display: none;
        }

        #model-info {
            padding: 0.5rem 1rem;
            color: #666;
            font-size: 0.875rem;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        .load-model-button {
            background: rgb(20, 184, 166);
            color: #000;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 1rem auto;
            display: block;
        }

        /* XST Switch Styles */
        .xst-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
            margin-left: 1rem;
        }

        .xst-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .xst-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2a2a2a;
            transition: .4s;
            border-radius: 30px;
        }

        .xst-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .xst-slider {
            background-color: rgb(45, 212, 191);
        }

        input:checked + .xst-slider:before {
            transform: translateX(30px);
        }

        .xst-label {
            margin-left: 70px;
            font-size: 0.875rem;
            color: #fff;
        }

        .debug-toggle {
            display: block;
            background: none;
            border: none;
            color: #666;
            font-size: 0.8rem;
            padding: 4px 0;
            cursor: pointer;
            margin-top: 8px;
        }

        .debug-toggle:hover {
            color: #fff;
        }

        .debug-content {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 8px;
            margin-top: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            color: #666;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <i data-lucide="message-circle" style="color: rgb(45, 212, 191)"></i>
            <h1>Gemma3 1B with XST beta 2</h1>
            <div class="status">
                <div class="status-dot"></div>
                <span id="status-text">Offline</span>
            </div>
            <!-- XST Switch -->
            <label class="xst-switch">
                <input type="checkbox" id="xst-toggle">
                <span class="xst-slider"></span>
                <span class="xst-label">XST Mode</span>
            </label>
        </div>

        <div id="setup-container">
            <textarea id="system-prompt"></textarea>
            <button id="save-prompt" class="button">
                <i data-lucide="save"></i>
                Save System Prompt
            </button>
        </div>

        <div id="model-info">Please load a model...</div>
        <div id="messages"></div>
        <div id="loading"></div>

        <div class="input-area">
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Type your message...">
                <button id="send-button" class="button" disabled>
                    <i data-lucide="send"></i>
                    Send
                </button>
                <button id="clear-button" class="button">
                    <i data-lucide="trash-2"></i>
                    Clear
                </button>
            </div>
        </div>
    </div>

   <script type="module">
    import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.0/esm/index.js';
    import { XST } from '../services/xst.js';

    let wllama;
    let isModelLoaded = false;
    let chatHistory = [];
    let xst = null;
    let isXSTRunning = false;
    let xstLoop = null;
const CONTEXT_WINDOW_SIZE = 10; // Number of recent messages to include in context
let tokenCache = new Map();

function loadTokenCache() {
    try {
        const savedCache = localStorage.getItem('tokenCache');
        const savedHistory = localStorage.getItem('chatHistory');
        
        if (savedCache && savedHistory) {
            const parsed = JSON.parse(savedCache);
            const history = JSON.parse(savedHistory);
            const validCache = new Map();
            
            for (const [key, value] of Object.entries(parsed)) {
                const msgObj = JSON.parse(key);
                if (msgObj.role === 'system' || 
                    history.some(h => h.role === msgObj.role && h.content === msgObj.content)) {
                    validCache.set(key, value);
                }
            }
            
            tokenCache = validCache;
            console.log('Token cache loaded and validated');
            localStorage.setItem('globalLoadingStatus', 'PID1738:1% Wllama is warming up...');
        }
    } catch (error) {
        console.error('Error loading token cache:', error);
        tokenCache = new Map();
    }
}

function saveTokenCache() {
    try {
        const cacheObj = Object.fromEntries(tokenCache);
        localStorage.setItem('tokenCache', JSON.stringify(cacheObj));
    } catch (error) {
        console.error('Error saving token cache:', error);
    }
}

function getRecentMessages(messages) {
    if (messages.length <= CONTEXT_WINDOW_SIZE) return messages;
    return messages.slice(-CONTEXT_WINDOW_SIZE);
}


async function tokenizeAndCache(message) {
    const cacheKey = JSON.stringify(message);
    console.log('Checking cache for key:', cacheKey);
    console.log('Cache has this key?:', tokenCache.has(cacheKey));
    console.log('Current cache keys:', [...tokenCache.keys()]);
    
    if (!tokenCache.has(cacheKey)) {
        console.log('Cache miss, tokenizing:', message.content);
        const tokens = await wllama.tokenize(message.content);
        tokenCache.set(cacheKey, tokens);
        saveTokenCache();
    } else {
        console.log('Cache hit for:', message.content);
    }
    return tokenCache.get(cacheKey);
}
       
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');
    const clearButton = document.getElementById('clear-button');
    const loadingDiv = document.getElementById('loading');
    const systemPromptInput = document.getElementById('system-prompt');
    const savePromptButton = document.getElementById('save-prompt');
    const modelInfoDiv = document.getElementById('model-info');
    const statusText = document.getElementById('status-text');
    const xstToggle = document.getElementById('xst-toggle');

    // Initialize XST
    function initXST() {
        xst = new XST({ timeLimitMs: 600_000 }); // 10 minutes

        // Handle XST chat messages
        xst.onUserMessage = (text) => {
            // Add to UI
            addMessageToUI('assistant', text);
            // Store in history as XST message
            const xstMessage = { role: 'assistant', content: text };
            chatHistory.push(xstMessage);
            saveChatHistory();
            // Update Digita
            localStorage.setItem('DigitaMessage', text);
        };

        // Start XST loop
        async function runXSTLoop() {
            while (xst.running && !xst.isTimeUp()) {
                const toLLM = xst.getLLMMessage();
                
                try {
                    // Get system prompt and recent XST context
                    const messages = [
                        { role: 'system', content: systemPromptInput.value.trim() },
                        { role: 'user', content: toLLM }
                    ];

                    const response = await wllama.createChatCompletion(messages, {
                        maxTokens: 512,
                        temperature: 1.0,
                        topK: 64,
                        topP: 0.95,
                        useCache: true
                    });

                    // Try to fix common formatting issues
                    let fixedResponse = response.trim();
                    let feedback = [];

                    // Remove markdown code blocks
                    if (fixedResponse.startsWith('```json') && fixedResponse.endsWith('```')) {
                        feedback.push("Note: Removed markdown code blocks. Please send JSON directly.");
                        fixedResponse = fixedResponse.replace(/^```json\n/, '').replace(/\n```$/, '');
                    }

                    // Remove any leading/trailing backticks
                    if (fixedResponse.startsWith('`') && fixedResponse.endsWith('`')) {
                        feedback.push("Note: Removed backticks. Please send JSON directly.");
                        fixedResponse = fixedResponse.replace(/^`/, '').replace(/`$/, '');
                    }

                    // Store LLM's original response in history
                    const llmMessage = { role: 'assistant', content: fixedResponse };
                    chatHistory.push(llmMessage);
                    saveChatHistory();

                    // Process response through XST
                    const result = xst.processLLMResponse(fixedResponse);
                    if (result.error) {
                        console.error('XST error:', result.error);
                        
                        // Create error feedback for LLM
                        feedback.push(`Error: ${result.error}`);
                        feedback.push("Expected format: {\"cmd\": \"message\", \"args\": {\"text\": \"Your message\"}}");
                        
                        // Show error with debug info
                        addMessageToUI('system', 'Error processing LLM response. Providing feedback to AI...', 
                            `Original response:\n${response}\n\nAttempted fix:\n${fixedResponse}\n\nFeedback:\n${feedback.join('\n')}`);
                        
                        // Send feedback to LLM in next message
                        xst.postUserMessage(
                            "Your last response had formatting issues:\n" + feedback.join('\n') + 
                            "\n\nPlease ensure your response is valid JSON with the correct command structure."
                        );
                    } else if (feedback.length > 0) {
                        // If we had to fix something but it worked, still show debug info
                        addMessageToUI('system', 'Response automatically fixed', 
                            `Original response:\n${response}\n\nFixed response:\n${fixedResponse}\n\nFixes applied:\n${feedback.join('\n')}`);
                    }
                } catch (error) {
                    console.error('Error in XST loop:', error);
                    addMessageToUI('system', 'Error in XST processing. Restarting XST...');
                    xst.stop();
                    initXST();
                }
            }
            
            addMessageToUI('system', 'XST session ended.');
            xstToggle.checked = false;
            isXSTRunning = false;
        }

        xstLoop = runXSTLoop();
    }

    // Reset context and chat history
    function resetContext() {
        // Clear UI
        messagesDiv.innerHTML = '';
        // Clear history but keep system prompt
        const systemPrompt = systemPromptInput.value.trim();
        chatHistory = [];
        if (systemPrompt) {
            chatHistory.push({ role: 'system', content: systemPrompt });
        }
        // Save empty history
        saveChatHistory();
        // Clear token cache except system
        const newCache = new Map();
        tokenCache.forEach((value, key) => {
            const msgObj = JSON.parse(key);
            if (msgObj.role === 'system') {
                newCache.set(key, value);
            }
        });
        tokenCache = newCache;
        saveTokenCache();
        // Show reset message
        addMessageToUI('system', 'Chat context has been reset.');
    }

    // Check if chat history is in XST format
    function isXSTFormat() {
        // Skip system message when checking
        const messages = chatHistory.filter(msg => msg.role !== 'system');
        if (messages.length === 0) return true;  // Empty history is valid
        
        // Check if messages are JSON commands
        try {
            return messages.every(msg => {
                if (msg.role === 'assistant') {
                    // Parse LLM response as JSON
                    const parsed = JSON.parse(msg.content);
                    return parsed.cmd !== undefined;
                }
                return true; // User messages can be normal text
            });
        } catch (e) {
            return false; // If we can't parse as JSON, it's not XST format
        }
    }

    // XST Toggle Handler
    xstToggle.addEventListener('change', () => {
        if (xstToggle.checked) {
            if (!isModelLoaded) {
                xstToggle.checked = false;
                addMessageToUI('system', 'Please load the model before enabling XST.');
                return;
            }

            // Check if we need to reset context
            if (!isXSTFormat()) {
                addMessageToUI('system', 'Chat history not in XST format. Resetting context...');
                resetContext();
            }

            // Initialize XST if not already running
            if (!xst || !xst.running) {
                initXST();
                addMessageToUI('system', 'XST mode enabled. AI sentience activated.');
                isXSTRunning = true;
            }
        } else {
            if (xst) {
                xst.stop();
                // Always reset when disabling XST
                resetContext();
                addMessageToUI('system', 'XST mode disabled. Context reset.');
                isXSTRunning = false;
            }
        }
    });

    // Function to build context efficiently
  async function buildContext(messages) {
    const systemMessage = { role: 'system', content: systemPromptInput.value.trim() };
    const recentMessages = getRecentMessages(messages);
    let tokenizedMessages = [];
    
    // First tokenize all existing messages
    for (const msg of recentMessages) {
        const tokens = await tokenizeAndCache(msg);
        tokenizedMessages.push(tokens);
    }
    
    // Then add system message tokens last to ensure fresh system prompt is used
    const systemTokens = await tokenizeAndCache(systemMessage);
    tokenizedMessages.unshift(systemTokens);
    
    return tokenizedMessages.flat();
}

    // Add model loading button
    const addLoadModelButton = () => {
        var button = document.createElement('button');
        button.className = 'load-model-button';
        button.innerHTML = '<i data-lucide="download"></i> Load Model';
        messagesDiv.appendChild(button);

        button.addEventListener('click', () => {
            button.remove();
            initWllama();
        });
    };

    // Extract chat message from XST JSON
    function extractChatMessage(content) {
        try {
            const json = JSON.parse(content);
            if (json.cmd === 'message' && json.args && json.args.text) {
                return json.args.text;
            }
        } catch (e) {
            // If not JSON or no message command, return as is
            return content;
        }
        return content;
    }

    // Load chat history from localStorage
    const loadChatHistory = () => {
        const history = localStorage.getItem('chatHistory');
        if (history) {
            chatHistory = JSON.parse(history);
            
            // Display messages, parsing XST format if needed
            chatHistory.forEach(msg => {
                if (msg.role === 'assistant') {
                    // For assistant messages, try to extract chat message from XST format
                    const displayText = extractChatMessage(msg.content);
                    addMessageToUI(msg.role, displayText);
                } else {
                    // For user/system messages, display as is
                    addMessageToUI(msg.role, msg.content);
                }
            });
        }
    };

    // Save chat history to localStorage
    const saveChatHistory = () => {
        localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
    };

    // Load system prompt from localStorage
    const loadSystemPrompt = () => {
        const prompt = localStorage.getItem('systemPrompt');
        if (prompt) {
            systemPromptInput.value = prompt;
        }
    };

    // Save system prompt to localStorage
    savePromptButton.addEventListener('click', () => {
        localStorage.setItem('systemPrompt', systemPromptInput.value);
        addMessageToUI('system', 'System prompt saved successfully');
    });

    // Modified addMessageToUI function with debug support
    const addMessageToUI = (role, content, debug = null) => {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', `${role}-message`);

        if (debug) {
            // Create main content
            const contentDiv = document.createElement('div');
            contentDiv.textContent = content;
            messageDiv.appendChild(contentDiv);

            // Create debug toggle
            const toggleButton = document.createElement('button');
            toggleButton.className = 'debug-toggle';
            toggleButton.textContent = 'Show Raw Response';
            messageDiv.appendChild(toggleButton);

            // Create debug content
            const debugDiv = document.createElement('pre');
            debugDiv.className = 'debug-content';
            debugDiv.style.display = 'none';
            debugDiv.textContent = debug;
            messageDiv.appendChild(debugDiv);

            // Toggle handler
            toggleButton.onclick = () => {
                const isHidden = debugDiv.style.display === 'none';
                debugDiv.style.display = isHidden ? 'block' : 'none';
                toggleButton.textContent = isHidden ? 'Hide Raw Response' : 'Show Raw Response';
            };
        } else {
            messageDiv.textContent = content;
        }

        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    };

    // Check for cached model
    const checkCachedModel = async () => {
        try {
            const cache = await caches.open('wllama-model-cache');
            const response = await cache.match('gemma-3-1b-it-UD-Q6_K_XL.gguf');
            return !!response;
        } catch (error) {
            console.error('Error checking cache:', error);
            return false;
        }
    };

    // Listen for DigitaUserMessage changes
    function setupDigitaUserMessageListener() {
        let lastValue = localStorage.getItem('DigitaUserMessage');
        
        setInterval(() => {
            const currentValue = localStorage.getItem('DigitaUserMessage');
            if (currentValue && currentValue !== lastValue) {
                lastValue = currentValue;
                userInput.value = currentValue;
                handleSend();
            }
        }, 100);
    }

    // Initialize Wllama
    const initWllama = async () => {
        loadingDiv.style.display = 'block';
        sendButton.disabled = true;
        statusText.textContent = 'Loading...';

        try {
            wllama = new Wllama({
                'single-thread/wllama.wasm': 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.0/esm/single-thread/wllama.wasm',
                'multi-thread/wllama.wasm': 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.0/esm/multi-thread/wllama.wasm'
            });

            await wllama.loadModelFromHF(
                'unsloth/gemma-3-1b-it-GGUF',
                'gemma-3-1b-it-UD-Q6_K_XL.gguf',
                {
                    progressCallback: ({ loaded, total }) => {
                        const progress = Math.round((loaded / total) * 100);
                        loadingDiv.textContent = `Loading Gemma3... ${progress}%`;
                        localStorage.setItem('globalLoadingStatus', `PID1738:${progress}% Loading language model files...`);
                    },
                    cache: true
                }
            );

            const template = await wllama.getChatTemplate();
            if (template) {
                await tokenizeAndCache({ role: 'system', content: template });
            }

            modelInfoDiv.textContent = `Model loaded successfully | Chat template: ${template ? 'Available' : 'Using default'}`;

            isModelLoaded = true;
            loadingDiv.style.display = 'none';
            sendButton.disabled = false;
            statusText.textContent = 'Online';

            setupDigitaUserMessageListener();
            addMessageToUI('system', 'Model loaded successfully. You can start chatting!');
            localStorage.setItem('globalLoadingStatus', 'PID1738:100% Language model fully initialized.');
        } catch (error) {
            console.error('Error initializing Wllama:', error);
            loadingDiv.textContent = 'Error loading model. Please try again.';
            localStorage.setItem('globalLoadingStatus', 'PID1738:11% Failed to load the language model, Digita needs to restart!');
            statusText.textContent = 'Error';
            addLoadModelButton();
        }
    };

    // Handle sending messages
  const handleSend = async () => {
    const message = userInput.value.trim();
    if (!message) return;

    // Handle XST mode differently
    if (isXSTRunning) {
        // Just add message to XST queue and UI
        xst.postUserMessage(message);
        addMessageToUI('user', message);
        userInput.value = '';
        // Store in chat history
        const userMessage = { role: 'user', content: message };
        chatHistory.push(userMessage);
        saveChatHistory();
        return;
    }

    // Normal chat mode
    const userMessage = { role: 'user', content: message };
    chatHistory.push(userMessage);
    addMessageToUI('user', message);
    userInput.value = '';
    sendButton.disabled = true;
    loadingDiv.style.display = 'block';

    try {
        // Tokenize the new message first to add it to cache
        await tokenizeAndCache(userMessage);
        
        const recentMessages = getRecentMessages(chatHistory);
        const messages = [
            { role: 'system', content: systemPromptInput.value.trim() },
            ...recentMessages
        ];

        const response = await wllama.createChatCompletion(messages, {
            maxTokens: 512,
            temperature: 1.0,
            topK: 64,
            topP: 0.95,
            useCache: true
        });
        /*
        According to the Gemma team, the optimal config for inference is
        temperature = 1.0, top_k = 64, top_p = 0.95, min_p = 0.0
        */

        localStorage.setItem('DigitaMessage', response.trim());

        const assistantMessage = { role: 'assistant', content: response.trim() };
        chatHistory.push(assistantMessage);
        // Cache the response immediately
        await tokenizeAndCache(assistantMessage);
        
        addMessageToUI('assistant', response.trim());
        saveChatHistory();
        saveTokenCache();
    } catch (error) {
        console.error('Error generating response:', error);
        addMessageToUI('system', 'Sorry, I encountered an error generating a response.');
    }

    loadingDiv.style.display = 'none';
    sendButton.disabled = false;
};

    // Event listeners
    sendButton.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    clearButton.addEventListener('click', () => {
        messagesDiv.innerHTML = '';
        chatHistory = [];
        const newCache = new Map();
        tokenCache.forEach((value, key) => {
            const msgObj = JSON.parse(key);
            if (msgObj.role === 'system') {
                newCache.set(key, value);
            }
        });
        tokenCache = newCache;
        saveTokenCache();
        localStorage.removeItem('chatHistory');
        if (!isModelLoaded) {
            addLoadModelButton();
        }

        // Stop XST if running
        if (isXSTRunning) {
            xst.stop();
            xstToggle.checked = false;
            isXSTRunning = false;
        }
    });    // Initialize
    loadTokenCache(); // Load token cache on startup
    loadSystemPrompt();
    loadChatHistory();
    addLoadModelButton();


    // load a value from localStorage
function getLocalStorageValue(key, defaultValue, validator) {
    const value = localStorage.getItem(key);

    // If the key doesn't exist, return the default value
    if (value === null) {
        return defaultValue;
    }

    return value;
}
    
    const LAZY_LOAD_KEY = 'lazyLoadPreference';
    const lazyLoadPreference = getLocalStorageValue(LAZY_LOAD_KEY, 'lazy', (value) => {
        return ['lazy', 'full', 'safe'].includes(value);
    });

    switch (lazyLoadPreference) {
        case 'full':
            setTimeout(() => { const button = document.querySelector('.load-model-button'); button.remove(); initWllama(); }, 1000); 
            break;

        case 'safe':
            console.log(`Wllama didn't load automatically because Digita is in safe mode.`);
            break;

        case 'lazy':
        default:
            // Do nothing, iframes and extensions will load on tab switch
            break;
    }

</script>
