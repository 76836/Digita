<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Debug Terminal</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:monospace;background:#121212;color:#e0e0e0;height:100vh;overflow:hidden}
        .terminal-container{display:flex;flex-direction:column;height:100vh;background:#1e1e1e}
        .terminal-header{background:#1f1f1f;padding:16px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
        .terminal-title{color:#bb86fc;font-weight:500}
        .clear-btn{background:#333;border:none;color:#e0e0e0;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:12px}
        .clear-btn:hover{background:#555}
        .terminal-output{flex:1;overflow-y:auto;padding:16px;font-size:14px;line-height:1.4}
        .terminal-line{margin-bottom:8px;display:flex;flex-wrap:wrap;word-break:break-all}
        .prompt{color:#03dac6;margin-right:8px;font-weight:bold}
        .command{color:#e0e0e0}
        .output{color:#a0a0a0;margin-left:16px;margin-top:4px;white-space:pre-wrap}
        .output.error{color:#cf6679}
        .output.success{color:#03dac6}
        .output.info{color:#bb86fc}
        .input-container{background:#1f1f1f;border-top:1px solid #333;padding:12px 16px;display:flex;align-items:center;position:relative}
        .input-prompt{color:#03dac6;margin-right:8px;font-weight:bold}
        .input-field{flex:1;background:transparent;border:none;color:#e0e0e0;font-family:inherit;font-size:16px;outline:none}
        .send-btn{background:#03dac6;border:none;color:#000;padding:8px 16px;border-radius:20px;cursor:pointer;margin-left:8px;font-size:12px;font-weight:bold}
        .autocomplete-container{position:absolute;bottom:100%;left:16px;right:16px;background:#2a2a2a;border:1px solid #444;border-radius:8px;max-height:200px;overflow-y:auto;display:none;z-index:1000}
        .autocomplete-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
        .autocomplete-item:last-child{border-bottom:none}
        .autocomplete-item:hover,.autocomplete-item.selected{background:#3700b3;color:#fff}
        .autocomplete-desc{font-size:12px;color:#888;margin-left:8px}
        .method-params{color:#03dac6;font-size:11px}
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="terminal-title">JavaScript Debug Console</div>
            <button class="clear-btn" onclick="window.history.back();">Exit</button>
        </div>
        
        <div class="terminal-output" id="output">
            <div class="terminal-line">
                <span class="output info">Mess around, find out.</span>
            </div>
        </div>
        
        <div class="input-container">
            <div class="autocomplete-container" id="autocomplete"></div>
            <span class="input-prompt">></span>
            <input type="text" class="input-field" id="commandInput" placeholder="Type JavaScript..." autocomplete="off">
            <button class="send-btn" onclick="executeCurrentCommand()">Send</button>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const commandInput = document.getElementById('commandInput');
        const autocompleteContainer = document.getElementById('autocomplete');
        
        let commandHistory = JSON.parse(localStorage.getItem('terminalHistory') || '[]');
        let selectedIndex = -1;
        let allSuggestions = new Map();

        // Enhanced API discovery with method signatures
        function discoverAPIs() {
            const apis = new Map();
            
            // Terminal commands
            const commands = {
                'help': 'Show available commands',
                'clear': 'Clear terminal output',
                'history': 'Show command history',
                'storage': 'Show localStorage contents',
                'clearStorage': 'Clear all localStorage'
            };
            Object.entries(commands).forEach(([cmd, desc]) => apis.set(cmd, desc));

            // Method signatures for common APIs
            const methodSignatures = {
                'localStorage.setItem': '(key, value) - Store item',
                'localStorage.getItem': '(key) - Get stored item',
                'localStorage.removeItem': '(key) - Remove item',
                'localStorage.clear': '() - Clear all items',
                'sessionStorage.setItem': '(key, value) - Store session item',
                'sessionStorage.getItem': '(key) - Get session item',
                'fetch': '(url, options) - HTTP request',
                'JSON.parse': '(text) - Parse JSON string',
                'JSON.stringify': '(obj) - Convert to JSON',
                'console.log': '(...args) - Log to console',
                'console.error': '(...args) - Log error',
                'Math.random': '() - Random 0-1',
                'Math.floor': '(x) - Round down',
                'Array.from': '(iterable) - Create array',
                'Object.keys': '(obj) - Get property names',
                'parseInt': '(string, radix) - Parse integer',
                'parseFloat': '(string) - Parse float',
                'setTimeout': '(fn, ms) - Delay execution',
                'setInterval': '(fn, ms) - Repeat execution',
                'Promise.resolve': '(value) - Resolved promise',
                'Promise.all': '(promises) - Wait for all',
                'new Date': '() - Current date/time',
                'new Promise': '(executor) - Create promise'
            };

            // Auto-discover objects and their methods
            const globalObjects = [
                { obj: window, name: 'window', skipPrefix: true },
                { obj: document, name: 'document' },
                { obj: navigator, name: 'navigator' },
                { obj: localStorage, name: 'localStorage' },
                { obj: sessionStorage, name: 'sessionStorage' },
                { obj: console, name: 'console' },
                { obj: Array, name: 'Array', isConstructor: true },
                { obj: Object, name: 'Object', isConstructor: true },
                { obj: String, name: 'String', isConstructor: true },
                { obj: Number, name: 'Number', isConstructor: true },
                { obj: Math, name: 'Math' },
                { obj: Date, name: 'Date', isConstructor: true },
                { obj: JSON, name: 'JSON' },
                { obj: Promise, name: 'Promise', isConstructor: true }
            ];

            globalObjects.forEach(({ obj, name, skipPrefix, isConstructor }) => {
                try {
                    const methods = Object.getOwnPropertyNames(obj);
                    methods.forEach(method => {
                        const fullName = skipPrefix ? method : `${name}.${method}`;
                        if (typeof obj[method] === 'function' && !method.startsWith('_')) {
                            const signature = methodSignatures[fullName];
                            apis.set(fullName, signature || `${name} method`);
                        } else if (!skipPrefix && method !== 'prototype') {
                            apis.set(fullName, `${name} property`);
                        }
                    });

                    // Get prototype methods
                    if (obj.prototype && isConstructor) {
                        const prototypeMethods = Object.getOwnPropertyNames(obj.prototype);
                        prototypeMethods.forEach(method => {
                            if (typeof obj.prototype[method] === 'function' && method !== 'constructor') {
                                const signature = methodSignatures[`.${method}`];
                                apis.set(`.${method}`, signature || `${name} method`);
                            }
                        });
                    }
                } catch (e) {}
            });

            // Add method signatures to existing entries
            Object.entries(methodSignatures).forEach(([method, signature]) => {
                apis.set(method, signature);
            });

            // JavaScript keywords
            const keywords = {
                'const': 'Declare constant',
                'let': 'Block-scoped variable',
                'var': 'Function-scoped variable',
                'function': 'Function declaration',
                'async': 'Async function',
                'await': 'Wait for promise',
                'if': 'Conditional',
                'else': 'Alternative condition',
                'for': 'Loop',
                'while': 'While loop',
                'try': 'Error handling',
                'catch': 'Handle error',
                'throw': 'Throw error',
                'return': 'Return value',
                'typeof': 'Get type',
                'instanceof': 'Instance check',
                'new': 'Create instance',
                'class': 'Class declaration',
                'import': 'Import module',
                'export': 'Export module'
            };
            Object.entries(keywords).forEach(([k, v]) => apis.set(k, v));

            return apis;
        }

        // Intelligent input parsing for method suggestions
        function getContextualSuggestions(input) {
            const suggestions = [];
            const inputLower = input.toLowerCase();
            
            // Check if input ends with a dot for method suggestions
            const lastDot = input.lastIndexOf('.');
            const hasTrailingDot = input.endsWith('.');
            
            for (const [command, description] of allSuggestions.entries()) {
                const commandLower = command.toLowerCase();
                
                if (hasTrailingDot) {
                    // If input ends with dot, suggest methods for that object
                    const baseObject = input.slice(0, -1);
                    if (commandLower.startsWith(baseObject.toLowerCase() + '.')) {
                        const methodName = command.slice(baseObject.length + 1);
                        suggestions.push({ 
                            command: baseObject + '.' + methodName, 
                            display: methodName,
                            description 
                        });
                    }
                } else if (lastDot > 0) {
                    // Partial method name after dot
                    const baseObject = input.slice(0, lastDot);
                    const partialMethod = input.slice(lastDot + 1);
                    
                    if (commandLower.startsWith(baseObject.toLowerCase() + '.') && 
                        commandLower.slice(baseObject.length + 1).includes(partialMethod.toLowerCase())) {
                        suggestions.push({ command, display: command, description });
                    }
                } else {
                    // Regular matching
                    if (commandLower.includes(inputLower)) {
                        suggestions.push({ command, display: command, description });
                    }
                }
            }
            
            return suggestions;
        }

        allSuggestions = discoverAPIs();

        function addToOutput(content, className = '') {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            
            if (content.startsWith('>')) {
                line.innerHTML = `<span class="prompt">></span><span class="command">${content.substring(1).trim()}</span>`;
            } else {
                line.innerHTML = `<span class="output ${className}">${content}</span>`;
            }
            
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function executeCommand(command) {
            if (!command.trim()) return;
            
            commandHistory.push(command);
            localStorage.setItem('terminalHistory', JSON.stringify(commandHistory));
            addToOutput(`> ${command}`);
            
            try {
                if (command === 'help') {
                    addToOutput('Commands: help, clear, history, storage, clearStorage', 'info');
                    addToOutput(`${allSuggestions.size} JS APIs available with autocomplete`, 'info');
                    return;
                }
                if (command === 'clear') { clearTerminal(); return; }
                if (command === 'history') {
                    commandHistory.forEach((cmd, i) => addToOutput(`${i + 1}. ${cmd}`));
                    return;
                }
                if (command === 'storage') {
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        addToOutput(`${key}: ${localStorage.getItem(key).substring(0, 50)}...`);
                    }
                    return;
                }
                if (command === 'clearStorage') {
                    const backup = commandHistory;
                    localStorage.clear();
                    commandHistory = backup;
                    localStorage.setItem('terminalHistory', JSON.stringify(commandHistory));
                    addToOutput('Storage cleared', 'info');
                    return;
                }
                
                const result = eval(command);
                if (result !== undefined) {
                    const output = typeof result === 'object' ? 
                        JSON.stringify(result, null, 2) : String(result);
                    addToOutput(output, 'success');
                }
            } catch (error) {
                addToOutput(`Error: ${error.message}`, 'error');
            }
        }

        function showAutocomplete(input) {
            if (!input.trim()) {
                hideAutocomplete();
                return;
            }

            const suggestions = getContextualSuggestions(input);
            
            if (!suggestions.length) {
                hideAutocomplete();
                return;
            }
            
            // Sort by relevance
            suggestions.sort((a, b) => {
                const inputLower = input.toLowerCase();
                const aStarts = a.command.toLowerCase().startsWith(inputLower);
                const bStarts = b.command.toLowerCase().startsWith(inputLower);
                if (aStarts && !bStarts) return -1;
                if (!aStarts && bStarts) return 1;
                return a.command.length - b.command.length;
            });
            
            autocompleteContainer.innerHTML = '';
            suggestions.slice(0, 8).forEach((suggestion, index) => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                if (index === selectedIndex) item.classList.add('selected');
                
                const hasParams = suggestion.description.includes('(');
                item.innerHTML = `
                    <div>
                        <span>${suggestion.display}</span>
                        ${hasParams ? `<div class="method-params">${suggestion.description}</div>` : ''}
                    </div>
                    ${!hasParams ? `<span class="autocomplete-desc">${suggestion.description}</span>` : ''}
                `;
                
                item.onclick = () => {
                    commandInput.value = suggestion.command;
                    hideAutocomplete();
                    commandInput.focus();
                };
                
                autocompleteContainer.appendChild(item);
            });
            
            autocompleteContainer.style.display = 'block';
        }

        function hideAutocomplete() {
            autocompleteContainer.style.display = 'none';
            selectedIndex = -1;
        }

        function clearTerminal() {
            output.innerHTML = '<div class="terminal-line"><span class="output info">Terminal cleared</span></div>';
        }

        function executeCurrentCommand() {
            const command = commandInput.value;
            commandInput.value = '';
            hideAutocomplete();
            executeCommand(command);
            commandInput.focus();
        }

        // Event listeners
        commandInput.oninput = (e) => showAutocomplete(e.target.value);
        
        commandInput.onkeydown = (e) => {
            const suggestions = autocompleteContainer.querySelectorAll('.autocomplete-item');
            
            if (e.key === 'Enter') {
                e.preventDefault();
                if (selectedIndex >= 0 && suggestions[selectedIndex]) {
                    const selectedCommand = suggestions[selectedIndex].querySelector('span').textContent;
                    commandInput.value = selectedCommand;
                    hideAutocomplete();
                    return;
                }
                executeCurrentCommand();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedIndex = Math.min(selectedIndex + 1, suggestions.length - 1);
                suggestions.forEach((item, i) => {
                    item.classList.toggle('selected', i === selectedIndex);
                });
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedIndex = Math.max(selectedIndex - 1, -1);
                suggestions.forEach((item, i) => {
                    item.classList.toggle('selected', i === selectedIndex);
                });
            } else if (e.key === 'Tab') {
                e.preventDefault();
                if (selectedIndex >= 0 && suggestions[selectedIndex]) {
                    commandInput.value = suggestions[selectedIndex].querySelector('span').textContent;
                    hideAutocomplete();
                }
            } else if (e.key === 'Escape') {
                hideAutocomplete();
            }
        };

        document.onclick = (e) => {
            if (!e.target.closest('.input-container')) hideAutocomplete();
        };

        commandInput.focus();
        //addToOutput(`Loaded ${commandHistory.length} commands, ${allSuggestions.size} APIs discovered`);
    </script>
</body>
</html>
