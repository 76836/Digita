<!DOCTYPE HTML>
<html lang="en">

<head>
    <title>Background loader for Digita</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: rgba(69, 67, 21, 0.420);
        background-attachment: fixed;
        background-repeat: no-repeat;
        margin: 0;
    }

    .iframe-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -100;
        margin: 0;
    }

    iframe {
        border: none;
    }
</style>

<body>

</body>
<script>
    var BKGURL = localStorage.getItem('DigitaBKGURL');

    if (BKGURL == null || BKGURL == "") {
        BKGURL = "https://76836.github.io/Digita/logo/DigitaIntro.mp4";
    };

    var url = BKGURL;
    // Function to check if the URL is an image
    function isImage(url) {
        return (url.match(/\.(jpg|jpeg|png|gif|bmp|webp|svg)$/i) != null);
    }

    // Function to set the background as an image
    function setBackgroundImage(url) {
        document.body.style.backgroundImage = `url('${url}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center center';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundAttachment = 'fixed';

        // For low-res images, disable image smoothing for sharper pixels
        document.body.style.imageRendering = 'pixelated'; // For retro/pixel art
        // OR use this for general upscaling:
        // document.body.style.imageRendering = 'crisp-edges';
    }

    // Function to check if the URL is a video
    function isVideo(url) {
        return (url.match(/\.(mp4|webm|ogg)$/i) != null);
    }

    // Function to set the background as a video
    function setBackgroundVideo(url) {
        const video = document.createElement('video');
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.className = 'background-video';
        video.style.position = 'fixed';
        video.style.top = '0';
        video.style.left = '0';
        video.style.width = '100vw';
        video.style.height = '100vh';
        video.style.objectFit = 'cover';
        video.style.zIndex = '-100';
        video.style.pointerEvents = 'none';
        video.style.margin = '0';
        video.style.background = 'transparent';

        const source = document.createElement('source');
        source.src = url;
        source.type = 'video/mp4'; // You may want to detect type from extension
        video.appendChild(source);

        // Fallback text
        video.innerHTML += 'bruh';

        document.body.appendChild(video);
    }


    // Function to set the background as an iframe
    function setIframe(url) {
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.classList.add('iframe-container');
        document.body.appendChild(iframe);
    }

    // Determine if the URL is an image, video, or a webpage and set the background accordingly
    if (isImage(url)) {
        setBackgroundImage(url);
    } else if (isVideo(url)) {
        setBackgroundVideo(url);
    } else {
        setIframe(url);
    }

    console.log('Background image loaded from persistent settings: ' + BKGURL);
</script>
